name: Deploy frontend
run-name: Deploy frontend ${{ inputs.environment || 'dev' }} from ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [develop]
permissions:
  contents: read
  id-token: write
concurrency:
  group: fasoecole-${{ inputs.environment || 'dev' }}-frontend
  cancel-in-progress: false
env:
  AWS_REGION: eu-west-3
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      PLATFORM_STACK: fasoecole-${{ inputs.environment || 'dev' }}-platform
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || (inputs.environment == 'prod' && 'main' || 'develop') }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate target and environment configuration
        env:
          AWS_ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in dev|prod) ;; *) exit 1 ;; esac
          if [ "$GITHUB_REF" != "refs/heads/$DEPLOY_BRANCH" ]; then
            echo "::error::Deploy $TARGET_ENVIRONMENT from branch $DEPLOY_BRANCH."
            exit 1
          fi
          if [[ ! "$AWS_ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "::error::Configure a full AWS_ROLE_ARN in GitHub environment $TARGET_ENVIRONMENT."
            exit 1
          fi
      - name: Diagnose AWS OIDC identity
        uses: actions/github-script@v7
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            core.info(JSON.stringify({
              role: process.env.AWS_ROLE_ARN,
              repository: process.env.GITHUB_REPOSITORY,
              ref: process.env.GITHUB_REF,
              sub: claims.sub,
              aud: claims.aud,
              iss: claims.iss
            }, null, 2));
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - name: Build frontend for target environment
        run: npm run "build:$TARGET_ENVIRONMENT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check target platform exists
        run: aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" --query 'Stacks[0].StackStatus' --output text
      - name: Publish assets then entry point
        run: |
          set -euo pipefail
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" --query "Stacks[0].Outputs[?OutputKey=='Bucket'].OutputValue | [0]" --output text)
          DISTRIBUTION=$(aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" --query "Stacks[0].Outputs[?OutputKey=='Distribution'].OutputValue | [0]" --output text)
          OUTPUT=dist/fasoecole-front/browser
          test -f "$OUTPUT/index.html"
          # Keep previous hashed assets to allow existing browser sessions to finish.
          aws s3 sync "$OUTPUT/" "s3://$BUCKET/" --exclude index.html --cache-control 'public,max-age=86400'
          aws s3 cp "$OUTPUT/index.html" "s3://$BUCKET/index.html" --cache-control 'no-cache,max-age=0,must-revalidate' --content-type 'text/html'
          INVALIDATION=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$INVALIDATION"
      - name: Verify frontend and deep link
        run: |
          set -euo pipefail
          URL=$(aws cloudformation describe-stacks --stack-name "$PLATFORM_STACK" --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue | [0]" --output text)
          curl --fail --silent --show-error --max-time 30 "$URL/" | grep -qi '<app-root'
          curl --fail --silent --show-error --max-time 30 "$URL/connexion" | grep -qi '<app-root'
